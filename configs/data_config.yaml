data:
  modalities:
    - name: "T1"
      description: "Native T1-Weighted (TR/TE short, anatomical boundaries, gray-white matter)"
      index: 0
    - name: "T1ce"
      description: "Post-Contrast T1-Weighted (Gadolinium-enhanced, active tumor margins, BBB disruption)"
      index: 1
    - name: "T2"
      description: "T2-Weighted (Fluid sensitivity, peritumoral edema, tissue alterations)"
      index: 2
    - name: "FLAIR"
      description: "T2-Fluid Attenuated Inversion Recovery (CSF suppressed, non-enhancing hyperintensities)"
      index: 3

  labels:
    raw:
      0: "Background"
      1: "Necrotic Core (NCR) & Non-Enhancing Tumor (NETC)"
      2: "Peritumoral Edema (ED)"
      4: "Enhancing Tumor (ET)"
    
    clinical_subregions:
      ET:
        description: "Enhancing Tumor (active contrast-enhancing)"
        raw_labels: [4]
        channel_index: 0
      TC:
        description: "Tumor Core (ET + NCR/NETC)"
        raw_labels: [1, 4]
        channel_index: 1
      WT:
        description: "Whole Tumor (TC + Vasogenic Edema / FLAIR hyperintensities)"
        raw_labels: [1, 2, 4]
        channel_index: 2

  classification_targets:
    0: "Glioma Grade II/III"
    1: "Glioblastoma Grade IV"
    2: "Meningioma"

  preprocessing:
    spatial_resampling:
      target_spacing: [1.0, 1.0, 1.0] # mm isotropic
      interpolator: "bspline" # for images, nearest for labels
    registration:
      target_reference: "T1ce"
      transform_type: "Rigid3D"
    normalization:
      type: "nonzero_zscore"
      epsilon: 1e-8
    skull_stripping:
      enabled: true
      threshold_ratio: 0.05
    crop_foreground:
      enabled: true
      margin: 5
    patch_size: [128, 128, 128]
    sliding_window_overlap: 0.5
