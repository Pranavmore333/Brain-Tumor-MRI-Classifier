swin_unetr:
  spatial_dims: 3
  in_channels: 4
  out_channels: 3 # ET, TC, WT
  img_size: [128, 128, 128]
  feature_size: 48
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 7
  patch_size: 2
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  dropout_path_rate: 0.1
  use_checkpoint: false
  classification_classes: 3

mednext:
  spatial_dims: 3
  in_channels: 4
  out_channels: 3 # ET, TC, WT
  base_channels: 32
  kernel_size: 7
  expansion_ratio: 4
  num_stages: 4
  blocks_per_stage: [2, 2, 2, 2]
  dropout: 0.1
  classification_classes: 3

training:
  composite_loss:
    lambda_ce: 1.0
    lambda_cls: 0.5
    dice_smooth: 1.0e-5
  optimizer:
    name: "AdamW"
    lr: 2.0e-4
    weight_decay: 1.0e-5
  lr_scheduler:
    name: "CosineAnnealingLR"
    t_max: 200
    eta_min: 1.0e-6
  cross_validation:
    n_splits: 5
    stratified: true
